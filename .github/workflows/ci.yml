name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ============================================================================
  # Job 1: Build e Testes
  # ============================================================================
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      # PostgreSQL para testes de integração (se necessário)
      # Os testes unitários usam H2 em memória (perfil test)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: msbluedot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build e Testes
        run: mvn clean test jacoco:report --batch-mode
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publicar Relatório de Cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Upload Artefatos de Teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ============================================================================
  # Job 2: Build do WAR
  # ============================================================================
  build-war:
    name: Build WAR
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: ms-bluedot-war
          path: target/*.war
          retention-days: 14

  # ============================================================================
  # Job 3: Build Docker Image (apenas main branch)
  # ============================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ms-bluedot:${{ github.sha }},ms-bluedot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
