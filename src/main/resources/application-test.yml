spring:
  # H2 em memória para testes unitários rápidos
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA - H2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # H2 Console (debug)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway desabilitado (H2 cria schema via ddl-auto)
  flyway:
    enabled: false

  # Cache desabilitado nos testes para evitar interferências entre testes
  cache:
    type: none

# Logging mínimo
logging:
  level:
    root: WARN
    com.scasistemas.msbluedot: INFO

# Cloudflare mock (não chamar API real nos testes)
app:
  cloudflare:
    base-url: http://localhost:${wiremock.server.port:8888}
  image:
    compression:
      enabled: false   # desabilitar compressão nos testes para velocidade

# Swagger desabilitado em testes
springdoc:
  swagger-ui:
    enabled: false
