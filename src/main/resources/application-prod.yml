spring:
  # PostgreSQL - Produção via variáveis de ambiente
  datasource:
    url: ${DATABASE_URL_MS:jdbc:postgresql://app-producao-msbluedot-pkat.hospedagemelastica.com.br:5432/iqdwsdzxhxdr}
    username: ${DB_USER_MS}
    password: ${DB_PASSWORD_MS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA - NUNCA usar create/update em produção
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

# Logging otimizado
logging:
  level:
    root: WARN
    com.scasistemas.msbluedot: INFO
    org.springframework: WARN
  file:
    name: /var/log/ms-bluedot/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Swagger desabilitado/protegido em produção
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Actuator restrito em produção
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT OBRIGATÓRIO via variáveis de ambiente
app:
  jwt:
    secret: ${JWT_SECRET}           # OBRIGATÓRIO - sem valor padrão!
    expiration: ${JWT_EXPIRATION:1800000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID}
    get-token: ${CLOUDFLARE_GET_TOKEN}
    post-token: ${CLOUDFLARE_POST_TOKEN}
