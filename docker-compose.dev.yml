version: "3.9"

# ==============================================================================
# MS Imagens - Docker Compose para DESENVOLVIMENTO
# Sobrepõe o docker-compose.yml com configurações de dev
#
# Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================

services:

  # Em desenvolvimento, apenas o banco sobe via Docker
  # A aplicação roda localmente com: mvn spring-boot:run
  postgres:
    container_name: ms-imagens-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: msimagens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  # Opcional: PgAdmin para gerenciar o banco visualmente
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ms-imagens-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres-dev-data:
    driver: local
